<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Pillar Gradient (Deep Cinematic Crimson) -->
    <linearGradient id="aayushLeftPillar" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#730308" />
      <stop offset="40%" stop-color="#9e060e" />
      <stop offset="85%" stop-color="#cc0812" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>

    <!-- Right Pillar Gradient (Luminous Netflix Red) -->
    <linearGradient id="aayushRightPillar" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ff3b45" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#ab060e" />
    </linearGradient>

    <!-- Crossbar Ribbon Gradient (Dynamic 3D Bridge) -->
    <linearGradient id="aayushCrossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d60913" />
      <stop offset="30%" stop-color="#ff2633" />
      <stop offset="70%" stop-color="#ff3b45" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>

    <!-- Top Bevel Highlight Flare -->
    <linearGradient id="aayushApexFlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ff6670" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </linearGradient>

    <!-- Crossbar Drop Shadow Filter for 3D Layering -->
    <filter id="aayushRibbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Ambient Cinema Red Glow -->
    <filter id="aayushAmbientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#e50914" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Cinema Logo Group with Transparent Background -->
  <g filter="url(#aayushAmbientGlow)">
    <!-- Layer 1: Left Pillar (Shadowed Core) -->
    <path d="M 76 456 L 218 56 L 294 56 L 158 456 Z" fill="url(#aayushLeftPillar)" />

    <!-- Layer 2: Right Pillar (Vibrant Illuminated Face) -->
    <path d="M 218 56 L 294 56 L 436 456 L 354 456 L 256 168 Z" fill="url(#aayushRightPillar)" />

    <!-- Layer 3: Ribbon Crossbar (Folds Over Left Pillar with Deep Drop Shadow) -->
    <path d="M 116 350 L 138 286 L 374 286 L 396 350 Z" 
          fill="url(#aayushCrossbar)" 
          filter="url(#aayushRibbonShadow)" />

    <!-- Top Edge Highlight of Crossbar -->
    <path d="M 138 286 L 374 286 L 372 291 L 140 291 Z" fill="#ff7a83" opacity="0.8" />

    <!-- Layer 4: Apex Bevel Accent -->
    <polygon points="218,56 294,56 274,96 238,96" fill="url(#aayushApexFlare)" />

    <!-- Layer 5: Sleek Cinema Play Glyph Emblem -->
    <polygon points="244,302 274,318 244,334" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
